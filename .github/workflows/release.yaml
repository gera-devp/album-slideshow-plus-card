name: Release

on:
  push:
    tags: ["v*"]
  # A release published from the GitHub web page creates its tag there.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifest.json version matches the tag
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('custom_components/album_slideshow_plus/manifest.json'))['version'])")
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          TAG="${TAG#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::manifest.json version ($VERSION) does not match tag ($TAG)"
            exit 1
          fi

      - name: Build album_slideshow_plus.zip (for manual installs)
        run: |
          cd custom_components/album_slideshow_plus
          zip -r "$GITHUB_WORKSPACE/album_slideshow_plus.zip" . -x "__pycache__/*" "*.pyc" ".DS_Store"

      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: album_slideshow_plus.zip
          fail_on_unmatched_files: true
